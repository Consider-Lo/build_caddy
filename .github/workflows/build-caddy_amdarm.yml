name: Build AMD64ARM64 Caddy
on: 
#  push:
#    branches: [ main ]
  workflow_dispatch: # 允许手动点击按钮运行

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            goamd64: v3      # 针对现代云服务器优化
          - goarch: arm64
            goamd64: v1      # ARM 架构不使用此参数

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with Plugins
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          # 使用重定向语法修复 klzgrad/forwardproxy 编译报错
          xcaddy build \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/mholt/caddy-l4 \
            --with github.com/mholt/caddy-webdav \
            --with github.com/WeidiDeng/caddy-cloudflare-ip \
            --with github.com/xcaddyplugins/caddy-trusted-cloudfront \
            --with github.com/caddyserver/jsonc-adapter \
            --with github.com/mholt/caddy-events-exec \
            --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive
       # --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@8563441787288fb82379918a354c0c355b5fd83c

      - name: Package Binary
        run: |
          # 给予执行权限并重命名
          chmod +x caddy
          mv caddy caddy-linux-${{ matrix.goarch }}
          # 打包为 tar.gz 以保留 Linux 权限位
          tar -czvf caddy-linux-${{ matrix.goarch }}.tar.gz caddy-linux-${{ matrix.goarch }}

      # 发布到 Release 页面
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          # 定义 Release 的标签（Tag），可以使用日期
          tag_name: caddy-pqc-${{ github.run_number }}
          name: "Caddy Custom Build (PQC Support) - Run ${{ github.run_number }}"
          body: |
            这是自动编译的自定义 Caddy 二进制文件。
            - 包含插件: forwardproxy-naive, cloudflare-dns, caddy-l4, caddy-webdav, caddy-cloudflare-ip, caddy-trusted-cloudfront, jsonc-adapter, caddy-events-exec
            - forwardproxy-naive 支持 [https://github.com/klzgrad/naiveproxy] 的 naiveproxy 客户端
            - cloudflare-dns 支持由 Cloudflare 解析的域名以 DNS-01 验证方式申请及更新 TLS 证书、支持由 Cloudflare 解析的域名可 ECH 发布
            - caddy-l4 支持 Caddy 的第 4 层（TCP/UDP）应用，可实现 SNI 分流共用 TCP/UDP 端口（含定向 UDP 转发）。SNI 分流共用 TCP 端口时支持 PROXY protocol 发送，即发送真实来源 IP 和端口给后端
            - caddy-webdav 支持 WebDAV 协议的网盘应用（服务端）
            - caddy-cloudflare-ip 支持启用可信任 Cloudflare IPs，可实现使用 Cloudflare CDN 后也能获取到客户端真实 IP
            - caddy-trusted-cloudfront 支持启用可信任 Cloudfront IPs，可实现使用 Cloudfront CDN 后也能获取到客户端真实 IP
            - jsonc-adapter 支持 Caddy 可使用 JSONC 格式配置文件（即可保留注释使用）
            - caddy-events-exec 支持事件执行应用，可解决相关程序不支持‘证书热更新’问题
            - 支持特性: X25519MLKEM768 (抗量子加密)
            - 编译环境: Go 1.23
          draft: false
          prerelease: false
          # 指定要上传的文件（支持通配符）
          files: |
            caddy-linux-${{ matrix.goarch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
